name: Python Basic Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project (if requirements exist)
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Syntax check
        run: |
          find . -name "*.py" -exec python -m py_compile {} +

      - name: Try importing top-level modules
        run: |
          for file in $(find . -maxdepth 5 -name "*.py"); do
            module=$(basename "$file" .py)
            python -c "import $module" || exit 1
          done
